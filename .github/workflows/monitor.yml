name: Vagas Monitor

# Necessário para o passo que commita data/jobs.json de volta ao repositório.
permissions:
  contents: write

on:
  schedule:
    # BRT = UTC-3. Só alertas imediatos (alta relevância) às 8h, 12h e 16h:
    - cron: "0 11,15,19 * * *"
    # 20h BRT: alertas imediatos + digest ranqueado do resto do dia:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      initial_notify:
        description: "Notificar tudo na primeira execução"
        default: "false"
      send_summary:
        description: "Enviar resumo ao final"
        default: "true"
      send_digest:
        description: "Enviar o digest ranqueado nesta execução"
        default: "false"

concurrency:
  group: vagas-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testes
        run: pytest -q
      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_NOTIFY: ${{ github.event.inputs.initial_notify || 'false' }}
          SEND_SUMMARY: ${{ github.event.inputs.send_summary || 'true' }}
          # Digest sai na execução das 20h BRT (cron 0 23) ou quando pedido manualmente.
          SEND_DIGEST: ${{ github.event.schedule == '0 23 * * *' || github.event.inputs.send_digest == 'true' }}
          HIGH_SCORE_THRESHOLD: "7"
          # Teto alto: a busca de tech tem muitas palavras-chave; sem isso o Gupy
          # pararia cedo e não cobriria o espectro inteiro de tecnologia.
          MAX_JOBS_PER_SEARCH: "1500"
          REQUEST_DELAY_SECONDS: "0.4"
        run: python -m src.main
      # Regenera o JSON enxuto que o painel do GitHub Pages consome. Roda sempre,
      # mesmo que o monitor não tenha achado nada, para o painel nunca ficar órfão.
      - name: Gerar dados do painel
        if: always()
        run: python -m src.dashboard

      - name: Commitar histórico e painel se mudou
        if: always()
        run: |
          if [[ -n "$(git status --porcelain data/jobs.json docs/data.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json docs/data.json
            git commit -m "chore: atualiza histórico de vagas [skip ci]"
            git push
          fi
