# Cada item é um perfil de busca independente. Uma vaga é notificada se casar
# com QUALQUER palavra de `keywords` e passar pelos demais filtros.
searches:
  # ---- 1) TECH REMOTO — em qualquer lugar ----
  # Lista ampla de termos de tech (a mesma é reaproveitada na busca 2 via âncora
  # YAML &tech / *tech). Sem senioridade e sem excluir estágio: traz tudo.
  - name: "Tech — Remoto"
    enabled: true
    profile: brasil
    precise: true                # usa filtro de 3 níveis (cargo no título)
    providers: [gupy, inhire, recrutei, greenhouse, lever, ashby, recruitee, smartrecruiters]
    keywords: &tech
      - "desenvolvedor"
      - "desenvolvimento"
      - "developer"
      - "programador"
      - "software"
      - "engenheiro de software"
      - "fullstack"
      - "full stack"
      - "front-end"
      - "frontend"
      - "back-end"
      - "backend"
      - "mobile"
      - "android"
      - "ios"
      - "react"
      - "node"
      - "python"
      - "java"
      - ".net"
      - "dados"
      - "data"
      - "analytics"
      - "business intelligence"
      - "cientista de dados"
      - "engenheiro de dados"
      - "analista de dados"
      - "machine learning"
      - "inteligência artificial"
      - "qa"
      - "teste de software"
      - "devops"
      - "sre"
      - "infraestrutura"
      - "cloud"
      - "banco de dados"
      - "dba"
      - "segurança da informação"
      - "analista de sistemas"
      - "análise de sistemas"
      - "suporte técnico"
      - "product owner"
      - "product manager"
      - "scrum"
      - "tecnologia"
      - "ti"
    exclude_keywords: []
    seniority: []                # qualquer (inclui estágio)
    workplace_types: [remote]    # só remoto / home office
    locations: []                # qualquer lugar, menos o que a lista abaixo barra
    # Barra vagas presas a outro país. Só entra termo inequívoco: local vazio
    # ou genérico ("Remote") continua passando de propósito, porque a vaga pode
    # aceitar o Brasil. Sem isso, as fontes globais (lever/ashby/smartrecruiters)
    # enchiam o perfil Brasil de vaga de São Francisco e Singapura.
    exclude_locations: &fora_do_brasil
      - "united states"
      - "usa"
      - "estados unidos"
      - "san francisco"
      - "new york"
      - "california"
      - "menlo park"
      - "foster city"
      - "bellevue"
      - "seattle"
      - "austin"
      - "boston"
      - "chicago"
      - "canada"
      - "toronto"
      - "united kingdom"
      - "london"
      - "england"
      - "ireland"
      - "dublin"
      - "europe"
      - "emea"
      - "apac"
      - "singapore"
      - "hong kong"
      - "asia"
      - "india"
      - "bangalore"
      - "taiwan"
      - "taipei"
      - "japan"
      - "tokyo"
      - "australia"
      - "sydney"
      - "melbourne"
      - "germany"
      - "berlin"
      - "munich"
      - "france"
      - "paris"
      - "poland"
      - "warsaw"
      - "netherlands"
      - "amsterdam"
      - "ho chi minh"
      - "vietnam"
      - "philippines"
      - "israel"
      - "tel aviv"
      - "dubai"
      - "south africa"

  # ---- 2) TECH HÍBRIDO — só BH e região metropolitana ----
  - name: "Tech — Híbrido (BH e região)"
    enabled: true
    profile: brasil
    precise: true
    # Recrutei fica de fora do híbrido: no modo global ele não traz a cidade,
    # então não dá pra filtrar por BH. Ele entra na busca de remoto.
    providers: [gupy, inhire, greenhouse, lever]
    keywords: *tech
    exclude_keywords: []
    seniority: []
    workplace_types: [hybrid]    # só híbrido
    locations:                   # precisa ser numa destas cidades (BH + região)
      # NÃO usar "mg"/"minas gerais" aqui: casaria o estado inteiro (ex.: Uberlândia).
      - "belo horizonte"
      - "contagem"
      - "betim"
      - "nova lima"
      - "ribeirão das neves"
      - "santa luzia"
      - "sabará"
      - "vespasiano"
      - "ibirité"
      # eixo Sete Lagoas / Pedro Leopoldo e região
      - "sete lagoas"
      - "pedro leopoldo"
      - "inhaúma"
      - "prudente de morais"
      - "matozinhos"
      - "capim branco"
      - "funilândia"
      - "caetanópolis"
      - "lagoa santa"
      - "confins"
      - "jaboticatubas"
      - "baldim"
    exclude_locations: *fora_do_brasil

  # ---- 3) PERFIL INTERNACIONAL — remoto aberto ao Brasil/LatAm (PT/ES) ----
  # Fonte: We Work Remotely (RSS). Só regiões que aceitam candidatos de fora dos
  # EUA/Europa (Anywhere / Latin America / Americas). Filtro de 3 níveis ligado.
  - name: "Internacional — Remoto (PT/ES)"
    enabled: true
    profile: internacional
    precise: true
    providers: [wwr, greenhouse, remotive, remoteok, lever, ashby]
    keywords: []                 # o filtro de 3 níveis já garante que é tech
    exclude_keywords: []
    seniority: []
    workplace_types: [remote]
    locations:                   # region do WWR que aceita Brasil/LatAm
      - "anywhere"
      - "latin america"
      - "americas"
      - "worldwide"
      - "brazil"
      - "south america"
      - "latam"
