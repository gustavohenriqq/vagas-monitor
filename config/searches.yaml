# =============================================================
# Configuração de buscas do Vagas Monitor
# Edite pelo painel web (python src/webapp.py) ou à mão aqui.
# =============================================================

# Empresas (tenants) do inhire a varrer. O tenant é o início do link do portal:
#   https://programmers.inhire.app  ->  tenant = "programmers"
# O inhire não tem busca global; por isso listamos as empresas aqui e o monitor
# filtra pela palavra-chave de cada busca localmente. Adicione quantas quiser.
inhire_companies:
  # --- lista inicial ---
  - programmers
  - appmax
  - portal
  - carreiras
  - heads
  - hand
  - monkey
  - talentetech
  - poncetech
  - nstech
  - auvotecnologia
  - alice
  - listo
  - frameworkdigital
  - atlastechnol
  # --- foco em dados / analytics / eng. dados ---
  - radix
  - matera
  - dp6
  - growdev
  - upflux
  - skopiadigital
  - extremegroup
  - bernhoeft
  - mesha
  - ninecon
  - objective
  - brivia
  - brq
  - yandeh
  - deloitte
  - bigdata
  - cora
  - exati
  - mazzatech
  - limaconsulting
  # - domo        (404 na API — subdomínio não existe; reative se souber o certo)
  # - bancobras   (404 na API — subdomínio não existe; Bancorbrás usa outro)
  - mathgroup
  - makasi
  - unitech
  - dtidigital
  - qitech
  - mjv
  - magazineluiza
  - anagaming
  - zallpy
  - queroeducacao
  - isystems
  # As páginas carreira.inhire.com.br/carreiras/<slug> são só landing pages;
  # o botão "Ver vagas" aponta para o tenant normal {empresa}.inhire.app:
  - v360
  - zetadados

# Cada item é um perfil de busca independente. Uma vaga é notificada se casar
# com QUALQUER palavra de `keywords` e passar pelos demais filtros.
searches:
  # ---- GUPY: todas as vagas de TECNOLOGIA ----
  # O Gupy tem vaga de tudo (vendas, saúde, etc.), então aqui usamos uma lista
  # ampla de termos de tech pra trazer só tecnologia. Sem filtro de senioridade,
  # sem local e SEM excluir estágio — traz júnior, estágio, pleno, sênior, tudo.
  - name: "Tecnologia (Gupy)"
    enabled: true
    providers: [gupy]
    keywords:
      - "desenvolvedor"
      - "desenvolvimento"
      - "developer"
      - "programador"
      - "software"
      - "engenheiro de software"
      - "fullstack"
      - "full stack"
      - "front-end"
      - "frontend"
      - "back-end"
      - "backend"
      - "mobile"
      - "android"
      - "ios"
      - "react"
      - "node"
      - "python"
      - "java"
      - ".net"
      - "dados"
      - "data"
      - "analytics"
      - "business intelligence"
      - "cientista de dados"
      - "engenheiro de dados"
      - "analista de dados"
      - "machine learning"
      - "inteligência artificial"
      - "qa"
      - "teste de software"
      - "devops"
      - "sre"
      - "infraestrutura"
      - "cloud"
      - "banco de dados"
      - "dba"
      - "segurança da informação"
      - "analista de sistemas"
      - "análise de sistemas"
      - "suporte técnico"
      - "product owner"
      - "product manager"
      - "ux"
      - "ui"
      - "designer"
      - "scrum"
      - "tecnologia"
      - "ti"
    exclude_keywords: []
    seniority: []          # qualquer (inclui estágio)
    workplace_types: []    # qualquer
    locations: []          # qualquer

  # ---- INHIRE: todas as vagas das empresas de tech listadas ----
  # As empresas do inhire_companies já são portais de tecnologia, então aqui
  # deixamos SEM palavra-chave: traz TODAS as vagas publicadas de cada empresa.
  - name: "inhire — todas as empresas"
    enabled: true
    providers: [inhire]
    keywords: []           # vazio = todas as vagas das empresas
    exclude_keywords: []
    seniority: []
    workplace_types: []
    locations: []
