# =============================================================
# Configuração de buscas do Vagas Monitor
# Edite pelo painel web (python src/webapp.py) ou à mão aqui.
# =============================================================

# Empresas (tenants) do inhire a varrer. O tenant é o início do link do portal:
#   https://programmers.inhire.app  ->  tenant = "programmers"
# O inhire não tem busca global; por isso listamos as empresas aqui e o monitor
# filtra pela palavra-chave de cada busca localmente. Adicione quantas quiser.
inhire_companies:
  # --- lista inicial ---
  - programmers
  - appmax
  - portal
  - carreiras
  - heads
  - hand
  - monkey
  - talentetech
  - poncetech
  - nstech
  - auvotecnologia
  - alice
  - listo
  - frameworkdigital
  - atlastechnol
  # --- foco em dados / analytics / eng. dados ---
  - radix
  - matera
  - dp6
  - growdev
  - upflux
  - skopiadigital
  - extremegroup
  - bernhoeft
  - mesha
  - ninecon
  - objective
  - brivia
  - brq
  - yandeh
  - deloitte
  - bigdata
  - cora
  - exati
  - mazzatech
  - limaconsulting
  # - domo        (404 na API — subdomínio não existe; reative se souber o certo)
  # - bancobras   (404 na API — subdomínio não existe; Bancorbrás usa outro)
  - mathgroup
  - makasi
  - unitech
  - dtidigital
  - qitech
  - mjv
  - magazineluiza
  - anagaming
  - zallpy
  - queroeducacao
  - isystems
  # As páginas carreira.inhire.com.br/carreiras/<slug> são só landing pages;
  # o botão "Ver vagas" aponta para o tenant normal {empresa}.inhire.app:
  - v360
  - zetadados

# Boards (empresas) do Greenhouse. O token é o trecho do link público:
#   https://job-boards.greenhouse.io/<token>  ->  token = "coinbase"
# São majoritariamente internacionais/remote-friendly (bom pro perfil PT/ES).
# Adicione as empresas que te interessam. Tokens inválidos são só ignorados.
greenhouse_companies:
  - coinbase
  - gitlab
  - dropbox
  - reddit
  - cloudflare
  - robinhood
  - brex
  - discord

# Empresas do Recrutei. O slug é o trecho do link público:
#   https://jobs.recrutei.com.br/digisystem  ->  slug = "digisystem"
# (Só entra em ação quando a URL do endpoint público for confirmada no código.)
recrutei_companies:
  - digisystem

# Cada item é um perfil de busca independente. Uma vaga é notificada se casar
# com QUALQUER palavra de `keywords` e passar pelos demais filtros.
searches:
  # ---- 1) TECH REMOTO — em qualquer lugar ----
  # Lista ampla de termos de tech (a mesma é reaproveitada na busca 2 via âncora
  # YAML &tech / *tech). Sem senioridade e sem excluir estágio: traz tudo.
  - name: "Tech — Remoto"
    enabled: true
    profile: brasil
    precise: true                # usa filtro de 3 níveis (cargo no título)
    providers: [gupy, inhire, recrutei]
    keywords: &tech
      - "desenvolvedor"
      - "desenvolvimento"
      - "developer"
      - "programador"
      - "software"
      - "engenheiro de software"
      - "fullstack"
      - "full stack"
      - "front-end"
      - "frontend"
      - "back-end"
      - "backend"
      - "mobile"
      - "android"
      - "ios"
      - "react"
      - "node"
      - "python"
      - "java"
      - ".net"
      - "dados"
      - "data"
      - "analytics"
      - "business intelligence"
      - "cientista de dados"
      - "engenheiro de dados"
      - "analista de dados"
      - "machine learning"
      - "inteligência artificial"
      - "qa"
      - "teste de software"
      - "devops"
      - "sre"
      - "infraestrutura"
      - "cloud"
      - "banco de dados"
      - "dba"
      - "segurança da informação"
      - "analista de sistemas"
      - "análise de sistemas"
      - "suporte técnico"
      - "product owner"
      - "product manager"
      - "scrum"
      - "tecnologia"
      - "ti"
    exclude_keywords: []
    seniority: []                # qualquer (inclui estágio)
    workplace_types: [remote]    # só remoto / home office
    locations: []                # qualquer lugar

  # ---- 2) TECH HÍBRIDO — só BH e região metropolitana ----
  - name: "Tech — Híbrido (BH e região)"
    enabled: true
    profile: brasil
    precise: true
    providers: [gupy, inhire, recrutei]
    keywords: *tech
    exclude_keywords: []
    seniority: []
    workplace_types: [hybrid]    # só híbrido
    locations:                   # precisa ser numa destas cidades (BH + região)
      # NÃO usar "mg"/"minas gerais" aqui: casaria o estado inteiro (ex.: Uberlândia).
      - "belo horizonte"
      - "contagem"
      - "betim"
      - "nova lima"
      - "ribeirão das neves"
      - "santa luzia"
      - "sabará"
      - "vespasiano"
      - "ibirité"
      # eixo Sete Lagoas / Pedro Leopoldo e região
      - "sete lagoas"
      - "pedro leopoldo"
      - "inhaúma"
      - "prudente de morais"
      - "matozinhos"
      - "capim branco"
      - "funilândia"
      - "caetanópolis"
      - "lagoa santa"
      - "confins"
      - "jaboticatubas"
      - "baldim"

  # ---- 3) PERFIL INTERNACIONAL — remoto aberto ao Brasil/LatAm (PT/ES) ----
  # Fonte: We Work Remotely (RSS). Só regiões que aceitam candidatos de fora dos
  # EUA/Europa (Anywhere / Latin America / Americas). Filtro de 3 níveis ligado.
  - name: "Internacional — Remoto (PT/ES)"
    enabled: true
    profile: internacional
    precise: true
    providers: [wwr, greenhouse]
    keywords: []                 # o filtro de 3 níveis já garante que é tech
    exclude_keywords: []
    seniority: []
    workplace_types: [remote]
    locations:                   # region do WWR que aceita Brasil/LatAm
      - "anywhere"
      - "latin america"
      - "americas"
      - "worldwide"
      - "brazil"
      - "south america"
      - "latam"
